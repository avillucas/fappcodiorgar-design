  <!-- Top-Left: Yellow square, Green hand (pointing left, thumb down) -->
  <rect x="0" y="0" width="210" height="210" fill="#FFE800" rx="4" />
  <g transform="translate(105, 105) rotate(-90) scale(1.6) translate(-50, -52)" fill="#009E49">
